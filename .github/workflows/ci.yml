name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"

jobs:
  run_tests:
    name: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11.8"]
        toxenv: [quality, docs, pii_check, django42, django52]
    steps:
      - uses: actions/checkout@v4
      # Only outcome helpers are used by the standalone tests. Full platform
      # integration tests still run in the LMS environment documented in the repo.
      - uses: actions/checkout@v4
        with:
          repository: openedx/openedx-platform
          ref: 46c543590c78aa1bfa846d47a4f1c5c6ec388490
          path: .ci-platform
          sparse-checkout: lms/djangoapps/lti_provider
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip
        run: pip install -r requirements/pip.txt

      - name: Install Dependencies
        run: pip install -r requirements/ci.txt

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
          LTI_TEST_PLATFORM_ROOT: ${{ github.workspace }}/.ci-platform
        run: tox

      - name: Run coverage
        if: matrix.python-version == '3.11.8' && matrix.toxenv == 'django42'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
